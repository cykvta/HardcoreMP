# Runtime state of the current game. Managed by the plugin.
# Do not edit this file while the server is running.
#
# The keys below are written by the plugin as soon as a game starts:
#
#   data:
#     create-time: 0     # creation time (epoch millis) of the current game world
#     reset-id: 0        # how many times the world has been reset
#     current-lives: 3   # lives left in the current session
#
# They are intentionally absent here so that an upgrade from an older version
# can move the values that used to live in config.yml.
