setting:
  # Name of the lobby-world
  lobby-world: "world"

  # Delete old worlds folder after reset
  remove-old-worlds: true

  # Change motd of the server
  motd: true

  # The list of players who can bypass the death event
  user-bypass-list:
    - cykuta

  # If this is set to true, prevent players keep their inventory after world reset if they are offline
  offline-player-inventory-clear: true

  # Set the amount of lives
  current-lives: 3
  max-lives: 3

  # World creation time, do not modify.
  create-time: 0

  # Reset ID counter, do not modify.
  reset-id: 0

